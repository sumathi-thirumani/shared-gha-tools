name: Refresh Dependency Graph
description: Submit dependencies to GitHub Dependency Graph
inputs:
  ecosystems:
    description: Comma-separated list of ecosystems detected (e.g., "python,node")
    required: true
  scan_label:
    description: Unique label for this scan target
    required: true
  source_dir:
    description: Source directory to scan
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Determine component detection inputs
      id: method
      shell: bash
      env:
        ECOSYSTEMS: ${{ inputs.ecosystems }}
        SOURCE_DIR: ${{ inputs.source_dir }}
      run: |
        set -euo pipefail
        if [[ "$SOURCE_DIR" == dir:* ]]; then
          CLEAN_DIR="${SOURCE_DIR#dir:}"
        else
          CLEAN_DIR="$SOURCE_DIR"
        fi
        echo "clean_dir=$CLEAN_DIR" >> "$GITHUB_OUTPUT"
        echo "Scanning directory: $CLEAN_DIR"

        if [[ ",$ECOSYSTEMS," == *",container,"* ]]; then
          echo "should_submit=false" >> "$GITHUB_OUTPUT"
          echo "has_poetry_lock=false" >> "$GITHUB_OUTPUT"
          echo "Skipping dependency graph submission for container ecosystem"
        elif [[ "$ECOSYSTEMS" =~ python ]] && [ -f "$CLEAN_DIR/poetry.lock" ]; then
          echo "should_submit=true" >> "$GITHUB_OUTPUT"
          echo "has_poetry_lock=true" >> "$GITHUB_OUTPUT"
          echo "Using component detection with Poetry detector enabled"
        else
          echo "should_submit=true" >> "$GITHUB_OUTPUT"
          echo "has_poetry_lock=false" >> "$GITHUB_OUTPUT"
          echo "Using component detection"
        fi

    ############################################################
    # Dependency submission
    ############################################################
    - name: Submit Poetry component detection dependency snapshot
      if: steps.method.outputs.should_submit == 'true' && steps.method.outputs.has_poetry_lock == 'true'
      uses: advanced-security/component-detection-dependency-submission-action@main
      with:
        filePath: ${{ steps.method.outputs.clean_dir }}
        correlator: refresh-dependency-graph-${{ inputs.scan_label }}
        detectorArgs: Poetry=EnableIfDefaultOff

    - name: Submit component detection dependency snapshot
      if: steps.method.outputs.should_submit == 'true' && steps.method.outputs.has_poetry_lock != 'true'
      uses: advanced-security/component-detection-dependency-submission-action@main
      with:
        filePath: ${{ steps.method.outputs.clean_dir }}
        correlator: refresh-dependency-graph-${{ inputs.scan_label }}